name: Release

on:
  push:
    # Trigger only when pushing tags starting with 'v' (e.g., v1.0.1, v2.0.0)
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allow GitHub Actions to create a Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically generate release notes based on commit history
          generate_release_notes: true
